<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="coming-soon.css">
    <script src="https://kit.fontawesome.com/c03d06761f.js" crossorigin="anonymous"></script>
    <script defer src="coming-soon.js"></script>
</head>
<body>
    <div class="coming-soon">
        <div class="header">
            <div class="logo"><img src="/logo-nobackground.png" alt="Logo"></div>
        </div>
        <div class="content">
            <div class="section-1">
                <div class="text">
                    <h1>Under <br>Construction</h1>
                    <p>Consider entering your email below to be notified when we go live.</p>
                </div>
                <div class="notify-form">
                    <form id="form" action="index.html">
                        <input name="notify-form" type="email" class="notify-box" placeholder="Enter your email" required>
                        <button type="submit" class="notify-button">Notify Me</button>
                    </form>
                </div>
            </div>
            <div id="countdown">
                <div class="countdown-item">
                    <span id="days"></span><p>days</p>
                </div>
                <div class="countdown-item">
                    <span id="hours"></span><p>hours</p>
                </div>
                <div class="countdown-item">
                    <span id="minutes"></span><p>minutes</p>
                </div>
                <div class="countdown-item">
                    <span id="seconds"></span><p>seconds</p>
                </div>
            </div>
        </div>
        <div class="footer">
            <div class="socials">
                <a href="#"><i class="fa-brands fa-facebook"></i></a>
                <a href="#"><i class="fa-brands fa-twitter"></i></a>
                <a href="#"><i class="fa-brands fa-instagram"></i></a>
            </div>
        </div>
    </div>
</body>
</html>
